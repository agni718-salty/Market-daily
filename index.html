<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>데일리 마켓 대시보드</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-main: #f0f0f0;
      --text-sub: #a0a0a0;
      --up-color: #E57373;
      --down-color: #64B5F6;
      --border-color: #2c2c2c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
      padding: 16px;
      max-width: 600px;
      margin: 0 auto;
    }
    header {
      text-align: center;
      padding: 12px 0 16px 0;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 16px;
    }
    header h1 { font-size: 1.3rem; font-weight: 700; }
    header p { font-size: 0.85rem; color: var(--text-sub); margin-top: 4px; }
    
    .section-title {
      font-size: 1.05rem;
      font-weight: 700;
      margin: 24px 0 12px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid var(--border-color);
    }
    
    .tab-selector {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .tab-btn, .time-btn {
      background: #2a2a2a;
      color: var(--text-sub);
      border: 1px solid #3a3a3a;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .tab-btn.active, .time-btn.active {
      background: #444;
      color: #fff;
      font-weight: bold;
      border-color: #666;
    }
    
    .chart-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 6px;
      margin-bottom: 8px;
    }
    .chart-name {
      font-size: 0.92rem;
      font-weight: 700;
      color: #ffd54f;
    }

    .canvas-box {
      width: 100%;
      height: 230px;
      background: #181818;
      border-radius: 8px;
      border: 1px solid #2a2a2a;
      position: relative;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    
    .indicator-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .indicator-row:last-child { border-bottom: none; }
    .indicator-title { font-weight: 600; font-size: 0.95rem; }
    .indicator-val { font-weight: 700; font-size: 0.95rem; }
    .up { color: var(--up-color); }
    .down { color: var(--down-color); }

    .news-item {
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-color);
    }
    .news-item:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
    .news-title {
      font-weight: 700;
      font-size: 0.98rem;
      color: #fff;
      margin-bottom: 4px;
      line-height: 1.4;
    }
    .news-link-box {
      margin-bottom: 8px;
    }
    .news-link {
      color: #82B1FF;
      text-decoration: none;
      font-size: 0.82rem;
      display: inline-block;
      border: 1px solid rgba(130, 177, 255, 0.4);
      padding: 2px 8px;
      border-radius: 4px;
      background: rgba(130, 177, 255, 0.05);
    }
    .news-summary {
      font-size: 0.88rem;
      color: #bbb;
      line-height: 1.6;
      text-align: justify;
      background: rgba(0,0,0,0.25);
      padding: 10px 12px;
      border-radius: 6px;
      border-left: 3px solid #82B1FF;
    }
    
    .schedule-item {
      font-size: 0.88rem;
      margin-bottom: 8px;
      color: #ddd;
    }
  </style>
</head>
<body>

  <header>
    <h1>📊 데일리 마켓 대시보드</h1>
    <p id="updated-time">동기화 중...</p>
  </header>

  <!-- 1. 주요 시장 지수 -->
  <div class="section-title">
    <span>📈 주요 시장 지수</span>
  </div>
  <div class="card">
    <div id="index-prices">불러오는 중...</div>
    
    <div style="margin-top: 14px; border-top: 1px solid var(--border-color); padding-top: 12px;">
      <div class="tab-selector" id="index-tabs">
        <button class="tab-btn active" onclick="selectIndexChart('S&P 500')">S&P 500</button>
        <button class="tab-btn" onclick="selectIndexChart('나스닥')">나스닥</button>
        <button class="tab-btn" onclick="selectIndexChart('다우 존스')">다우 존스</button>
        <button class="tab-btn" onclick="selectIndexChart('코스피')">코스피</button>
      </div>

      <div class="chart-header-row">
        <span class="chart-name" id="current-index-title">S&P 500 캔들차트</span>
        <div class="tab-selector" style="margin-bottom:0;">
          <button class="time-btn active" onclick="changeRange('3M')">3M</button>
          <button class="time-btn" onclick="changeRange('6M')">6M</button>
          <button class="time-btn" onclick="changeRange('1Y')">1Y</button>
          <button class="time-btn" onclick="changeRange('3Y')">3Y</button>
        </div>
      </div>
      <div class="canvas-box">
        <canvas id="candleCanvas"></canvas>
      </div>
    </div>
  </div>

  <!-- 2. 통화 & 거시 금리 -->
  <div class="section-title">
    <span>💵 통화 & 거시 금리 (최근 3개월)</span>
  </div>
  <div class="card">
    <div id="macro-prices">불러오는 중...</div>

    <div style="margin-top: 14px; border-top: 1px solid var(--border-color); padding-top: 12px;">
      <div class="tab-selector" id="macro-tabs">
        <button class="tab-btn active" onclick="selectMacroChart('원/달러 환율')">원/달러 환율</button>
        <button class="tab-btn" onclick="selectMacroChart('미국채 10년물 금리')">미국채 10년물</button>
        <button class="tab-btn" onclick="selectMacroChart('미국채 30년물 금리')">미국채 30년물</button>
      </div>
      <div class="chart-header-row">
        <span class="chart-name" id="current-macro-title">원/달러 환율 추이 (3개월)</span>
      </div>
      <div class="canvas-box">
        <canvas id="lineCanvas"></canvas>
      </div>
    </div>
  </div>

  <!-- 3. 국내 핵심 뉴스 10선 -->
  <div class="section-title">
    <span>📰 국내 핵심 경제 뉴스 10선</span>
  </div>
  <div class="card" id="news-list">불러오는 중...</div>

  <!-- 4. 경제 지표 일정 -->
  <div class="section-title">
    <span>📅 핵심 경제 지표 결과 & 일정</span>
  </div>
  <div class="card" id="calendar-info">불러오는 중...</div>

  <script>
    let globalData = null;
    let currentIndex = 'S&P 500';
    let currentRange = '3M';
    let currentMacro = '원/달러 환율';

    fetch('data.json?t=' + Date.now())
      .then(res => res.json())
      .then(data => {
        globalData = data;
        document.getElementById('updated-time').innerText = "최종 업데이트: " + (data.updated_at || "완료");

        if (data.indices && data.indices.summary) {
          document.getElementById('index-prices').innerHTML = data.indices.summary.map(item => {
            const isDown = String(item.change).startsWith('-');
            const sign = isDown ? '▼ ' : '▲ +';
            return `
              <div class="indicator-row">
                <span class="indicator-title">${item.name}</span>
                <span class="indicator-val ${isDown ? 'down' : 'up'}">
                  ${item.price} (${sign}${String(item.change_pct).replace('+', '')}%)
                </span>
              </div>
            `;
          }).join('');
        }

        if (data.macro && data.macro.summary) {
          document.getElementById('macro-prices').innerHTML = data.macro.summary.map(item => {
            const isDown = String(item.change).startsWith('-');
            const sign = isDown ? '▼ ' : '▲ +';
            return `
              <div class="indicator-row">
                <span class="indicator-title">${item.name}</span>
                <span class="indicator-val ${isDown ? 'down' : 'up'}">
                  ${item.value} (${sign}${String(item.change_str).replace('+', '')})
                </span>
              </div>
            `;
          }).join('');
        }

        if (data.news && data.news.length > 0) {
          document.getElementById('news-list').innerHTML = data.news.map((n, idx) => `
            <div class="news-item">
              <div class="news-title">${idx + 1}. ${n.title}</div>
              <div class="news-link-box">
                <a href="${n.link}" target="_blank" rel="noopener noreferrer" class="news-link">🔗 [원문 링크]</a>
              </div>
              <div class="news-summary">${n.summary}</div>
            </div>
          `).join('');
        }

        if (data.schedules) {
          document.getElementById('calendar-info').innerHTML = data.schedules.map(item => `
            <div class="schedule-item">
              <strong>• ${item.title}:</strong> ${item.desc}
            </div>
          `).join('');
        }

        drawCandleChart();
        drawLineChart();
      })
      .catch(err => {
        document.getElementById('updated-time').innerText = "데이터 로딩 오류: " + err.message;
      });

    // 날짜 레이블 포맷 헬퍼
    function formatDateLabel(dateStr, range) {
      if (!dateStr) return '';
      const parts = dateStr.split('-');
      if (parts.length === 3) {
        if (range === '3Y') {
          return `${parts[0].slice(2)}.${parts[1]}`;
        }
        return `${parts[1]}/${parts[2]}`;
      }
      return dateStr;
    }

    // 캔버스 캔들 차트 그리기
    function drawCandleChart() {
      if (!globalData || !globalData.indices || !globalData.indices.candles_dict) return;
      const rawCandles = globalData.indices.candles_dict[currentIndex] || [];
      if (rawCandles.length === 0) return;

      let bars = 65;
      if (currentRange === '6M') bars = 130;
      if (currentRange === '1Y') bars = 250;
      if (currentRange === '3Y') bars = 750;

      const candles = rawCandles.slice(-bars);
      const canvas = document.getElementById('candleCanvas');
      const ctx = canvas.getContext('2d');
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();

      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);

      const w = rect.width;
      const h = rect.height;
      const padLeft = 10;
      const padRight = 55;
      const padTop = 15;
      const padBottom = 26;

      let min = Math.min(...candles.map(c => c.low));
      let max = Math.max(...candles.map(c => c.high));
      if (min === max) { min *= 0.95; max *= 1.05; }

      ctx.clearRect(0, 0, w, h);

      // 가로 격자 및 가격 축
      ctx.strokeStyle = '#242424';
      ctx.fillStyle = '#777';
      ctx.font = '10px sans-serif';
      ctx.textAlign = 'left';

      for (let i = 0; i <= 4; i++) {
        const y = padTop + (h - padTop - padBottom) * (i / 4);
        ctx.beginPath();
        ctx.moveTo(padLeft, y);
        ctx.lineTo(w - padRight, y);
        ctx.stroke();

        const priceVal = max - (max - min) * (i / 4);
        ctx.fillText(priceVal.toLocaleString(undefined, {maximumFractionDigits: 1}), w - padRight + 5, y + 3);
      }

      // 세로 시간 보조선 및 날짜 눈금 (4구간 분할)
      const chartW = w - padLeft - padRight;
      const step = chartW / candles.length;
      ctx.textAlign = 'center';
      ctx.fillStyle = '#888';

      const timePoints = [0, Math.floor(candles.length * 0.33), Math.floor(candles.length * 0.66), candles.length - 1];
      timePoints.forEach(idx => {
        if (candles[idx]) {
          const x = padLeft + idx * step + step / 2;
          ctx.beginPath();
          ctx.strokeStyle = '#222';
          ctx.moveTo(x, padTop);
          ctx.lineTo(x, h - padBottom);
          ctx.stroke();

          const label = formatDateLabel(candles[idx].time, currentRange);
          ctx.fillText(label, x, h - 8);
        }
      });

      // 캔들 봉 그리기
      const candleW = Math.max(1.5, step * 0.7);

      candles.forEach((c, idx) => {
        const x = padLeft + idx * step + step / 2;
        const yHigh = padTop + (max - c.high) / (max - min) * (h - padTop - padBottom);
        const yLow = padTop + (max - c.low) / (max - min) * (h - padTop - padBottom);
        const yOpen = padTop + (max - c.open) / (max - min) * (h - padTop - padBottom);
        const yClose = padTop + (max - c.close) / (max - min) * (h - padTop - padBottom);

        const isUp = c.close >= c.open;
        const color = isUp ? '#E57373' : '#64B5F6';

        ctx.strokeStyle = color;
        ctx.fillStyle = color;

        // 심지
        ctx.beginPath();
        ctx.moveTo(x, yHigh);
        ctx.lineTo(x, yLow);
        ctx.stroke();

        // 몸통
        const bodyTop = Math.min(yOpen, yClose);
        const bodyH = Math.max(1.5, Math.abs(yOpen - yClose));
        ctx.fillRect(x - candleW / 2, bodyTop, candleW, bodyH);
      });
    }

    function selectIndexChart(indexName) {
      currentIndex = indexName;
      document.querySelectorAll('#index-tabs .tab-btn').forEach(b => {
        b.classList.toggle('active', b.innerText === indexName);
      });
      document.getElementById('current-index-title').innerText = `${indexName} 캔들차트`;
      drawCandleChart();
    }

    function changeRange(range) {
      currentRange = range;
      document.querySelectorAll('.time-btn').forEach(btn => {
        btn.classList.toggle('active', btn.innerText === range);
      });
      drawCandleChart();
    }

    // 캔버스 라인 차트 그리기
    function drawLineChart() {
      if (!globalData || !globalData.macro || !globalData.macro.series_dict) return;
      const series = globalData.macro.series_dict[currentMacro] || [];
      if (series.length === 0) return;

      const canvas = document.getElementById('lineCanvas');
      const ctx = canvas.getContext('2d');
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();

      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);

      const w = rect.width;
      const h = rect.height;
      const padLeft = 10;
      const padRight = 55;
      const padTop = 15;
      const padBottom = 26;

      let min = Math.min(...series.map(s => s.value));
      let max = Math.max(...series.map(s => s.value));
      if (min === max) { min *= 0.98; max *= 1.02; }

      ctx.clearRect(0, 0, w, h);

      // 가로 격자 및 가격 축
      ctx.strokeStyle = '#242424';
      ctx.fillStyle = '#777';
      ctx.font = '10px sans-serif';
      ctx.textAlign = 'left';

      for (let i = 0; i <= 4; i++) {
        const y = padTop + (h - padTop - padBottom) * (i / 4);
        ctx.beginPath();
        ctx.moveTo(padLeft, y);
        ctx.lineTo(w - padRight, y);
        ctx.stroke();

        const val = max - (max - min) * (i / 4);
        ctx.fillText(val.toFixed(2), w - padRight + 5, y + 3);
      }

      // 세로 시간 보조선 및 날짜 눈금 (4구간 분할)
      const chartW = w - padLeft - padRight;
      const step = chartW / (series.length - 1 || 1);
      ctx.textAlign = 'center';
      ctx.fillStyle = '#888';

      const timePoints = [0, Math.floor(series.length * 0.33), Math.floor(series.length * 0.66), series.length - 1];
      timePoints.forEach(idx => {
        if (series[idx]) {
          const x = padLeft + idx * step;
          ctx.beginPath();
          ctx.strokeStyle = '#222';
          ctx.moveTo(x, padTop);
          ctx.lineTo(x, h - padBottom);
          ctx.stroke();

          const label = formatDateLabel(series[idx].time, '3M');
          ctx.fillText(label, x, h - 8);
        }
      });

      // 라인 그리기
      ctx.beginPath();
      series.forEach((s, idx) => {
        const x = padLeft + idx * step;
        const y = padTop + (max - s.value) / (max - min) * (h - padTop - padBottom);
        if (idx === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.strokeStyle = '#64B5F6';
      ctx.lineWidth = 2;
      ctx.stroke();

      // 하단 그라데이션 채우기
      const lastX = padLeft + (series.length - 1) * step;
      const bottomY = h - padBottom;
      ctx.lineTo(lastX, bottomY);
      ctx.lineTo(padLeft, bottomY);
      ctx.closePath();

      const grad = ctx.createLinearGradient(0, padTop, 0, bottomY);
      grad.addColorStop(0, 'rgba(100, 181, 246, 0.35)');
      grad.addColorStop(1, 'rgba(100, 181, 246, 0.0)');
      ctx.fillStyle = grad;
      ctx.fill();
    }

    function selectMacroChart(macroName) {
      currentMacro = macroName;
      document.querySelectorAll('#macro-tabs .tab-btn').forEach(b => {
        b.classList.toggle('active', b.innerText.includes(macroName.split(' ')[0]));
      });
      document.getElementById('current-macro-title').innerText = `${macroName} 추이 (3개월)`;
      drawLineChart();
    }

    window.addEventListener('resize', () => {
      drawCandleChart();
      drawLineChart();
    });
  </script>
</body>
</html>
