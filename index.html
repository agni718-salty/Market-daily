<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>데일리 마켓 대시보드</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-main: #f0f0f0;
      --text-sub: #a0a0a0;
      --up-color: #E57373;
      --down-color: #64B5F6;
      --border-color: #2c2c2c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
      padding: 16px;
      max-width: 600px;
      margin: 0 auto;
    }
    header {
      text-align: center;
      padding: 12px 0 16px 0;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 16px;
    }
    header h1 { font-size: 1.3rem; font-weight: 700; }
    header p { font-size: 0.85rem; color: var(--text-sub); margin-top: 4px; }
    
    .section-title {
      font-size: 1.05rem;
      font-weight: 700;
      margin: 24px 0 12px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid var(--border-color);
    }
    
    .tab-selector {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .tab-btn, .time-btn {
      background: #2a2a2a;
      color: var(--text-sub);
      border: 1px solid #3a3a3a;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .tab-btn.active, .time-btn.active {
      background: #444;
      color: #fff;
      font-weight: bold;
      border-color: #666;
    }
    
    .chart-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 6px;
      margin-bottom: 6px;
    }
    .chart-name {
      font-size: 0.95rem;
      font-weight: 700;
      color: #ffd54f;
    }

    .chart-container {
      width: 100%;
      height: 250px;
      margin-top: 6px;
      position: relative;
    }
    
    .indicator-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .indicator-row:last-child { border-bottom: none; }
    .indicator-title { font-weight: 600; font-size: 0.95rem; }
    .indicator-val { font-weight: 700; font-size: 0.95rem; }
    .up { color: var(--up-color); }
    .down { color: var(--down-color); }

    .news-item {
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-color);
    }
    .news-item:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
    .news-title {
      font-weight: 700;
      font-size: 0.98rem;
      color: #fff;
      margin-bottom: 4px;
      line-height: 1.4;
    }
    .news-link-box {
      margin-bottom: 8px;
    }
    .news-link {
      color: #82B1FF;
      text-decoration: none;
      font-size: 0.82rem;
      display: inline-block;
      border: 1px solid rgba(130, 177, 255, 0.4);
      padding: 2px 8px;
      border-radius: 4px;
      background: rgba(130, 177, 255, 0.05);
    }
    .news-summary {
      font-size: 0.88rem;
      color: #bbb;
      line-height: 1.6;
      text-align: justify;
      background: rgba(0,0,0,0.25);
      padding: 10px 12px;
      border-radius: 6px;
      border-left: 3px solid #82B1FF;
    }
    
    .schedule-item {
      font-size: 0.88rem;
      margin-bottom: 8px;
      color: #ddd;
    }
  </style>
</head>
<body>

  <header>
    <h1>📊 데일리 마켓 대시보드</h1>
    <p id="updated-time">동기화 중...</p>
  </header>

  <!-- 1. 주요 시장 지수 -->
  <div class="section-title">
    <span>📈 주요 시장 지수</span>
  </div>
  <div class="card">
    <div id="index-prices">불러오는 중...</div>
    
    <div style="margin-top: 14px; border-top: 1px solid var(--border-color); padding-top: 12px;">
      <div class="tab-selector" id="index-tabs">
        <button class="tab-btn active" onclick="selectIndexChart('S&P 500')">S&P 500</button>
        <button class="tab-btn" onclick="selectIndexChart('나스닥')">나스닥</button>
        <button class="tab-btn" onclick="selectIndexChart('다우 존스')">다우 존스</button>
        <button class="tab-btn" onclick="selectIndexChart('코스피')">코스피</button>
      </div>

      <div class="chart-header-row">
        <span class="chart-name" id="current-index-title">S&P 500 캔들차트</span>
        <div class="tab-selector" style="margin-bottom:0;">
          <button class="time-btn active" onclick="changeRange('3M')">3M</button>
          <button class="time-btn" onclick="changeRange('6M')">6M</button>
          <button class="time-btn" onclick="changeRange('1Y')">1Y</button>
          <button class="time-btn" onclick="changeRange('3Y')">3Y</button>
        </div>
      </div>
      <div id="candle-chart" class="chart-container">차트를 로딩하는 중입니다...</div>
    </div>
  </div>

  <!-- 2. 통화 & 거시 금리 -->
  <div class="section-title">
    <span>💵 통화 & 거시 금리 (최근 3개월)</span>
  </div>
  <div class="card">
    <div id="macro-prices">불러오는 중...</div>

    <div style="margin-top: 14px; border-top: 1px solid var(--border-color); padding-top: 12px;">
      <div class="tab-selector" id="macro-tabs">
        <button class="tab-btn active" onclick="selectMacroChart('원/달러 환율')">원/달러 환율</button>
        <button class="tab-btn" onclick="selectMacroChart('미국채 10년물 금리')">미국채 10년물</button>
        <button class="tab-btn" onclick="selectMacroChart('미국채 30년물 금리')">미국채 30년물</button>
      </div>
      <div class="chart-header-row">
        <span class="chart-name" id="current-macro-title">원/달러 환율 추이</span>
      </div>
      <div id="line-chart" class="chart-container">차트를 로딩하는 중입니다...</div>
    </div>
  </div>

  <!-- 3. 국내 핵심 뉴스 10선 -->
  <div class="section-title">
    <span>📰 국내 핵심 경제 뉴스 10선</span>
  </div>
  <div class="card" id="news-list">불러오는 중...</div>

  <!-- 4. 경제 지표 일정 -->
  <div class="section-title">
    <span>📅 핵심 경제 지표 결과 & 일정</span>
  </div>
  <div class="card" id="calendar-info">불러오는 중...</div>

  <script>
    let globalData = null;
    let candleChart = null;
    let candleSeries = null;
    let currentIndex = 'S&P 500';
    let currentRange = '3M';

    let lineChart = null;
    let lineSeries = null;
    let currentMacro = '원/달러 환율';

    // 1. 차트 라이브러리를 비동기로 확실하게 불러오는 헬퍼 함수
    function loadTradingViewLibrary() {
      return new Promise((resolve, reject) => {
        if (window.LightweightCharts) {
          resolve();
          return;
        }
        const script = document.createElement('script');
        script.src = 'https://unpkg.com/lightweight-charts@4.0.1/dist/lightweight-charts.standalone.production.js';
        script.onload = () => resolve();
        script.onerror = () => {
          // 백업 CDN 시도
          const fallback = document.createElement('script');
          fallback.src = 'https://cdn.jsdelivr.net/npm/lightweight-charts@4.0.1/dist/lightweight-charts.standalone.production.js';
          fallback.onload = () => resolve();
          fallback.onerror = () => reject(new Error('차트 라이브러리 로드 실패'));
          document.head.appendChild(fallback);
        };
        document.head.appendChild(script);
      });
    }

    // 2. 데이터 가져오기 및 화면 출력
    fetch('data.json?t=' + Date.now())
      .then(res => res.json())
      .then(data => {
        globalData = data;
        document.getElementById('updated-time').innerText = "최종 업데이트: " + (data.updated_at || "완료");

        // [A] 지수 요약 테이블 렌더링
        if (data.indices && data.indices.summary) {
          document.getElementById('index-prices').innerHTML = data.indices.summary.map(item => {
            const isDown = String(item.change).startsWith('-');
            const sign = isDown ? '▼ ' : '▲ +';
            return `
              <div class="indicator-row">
                <span class="indicator-title">${item.name}</span>
                <span class="indicator-val ${isDown ? 'down' : 'up'}">
                  ${item.price} (${sign}${String(item.change_pct).replace('+', '')}%)
                </span>
              </div>
            `;
          }).join('');
        }

        // [B] 거시 지표 요약 렌더링
        if (data.macro && data.macro.summary) {
          document.getElementById('macro-prices').innerHTML = data.macro.summary.map(item => {
            const isDown = String(item.change).startsWith('-');
            const sign = isDown ? '▼ ' : '▲ +';
            return `
              <div class="indicator-row">
                <span class="indicator-title">${item.name}</span>
                <span class="indicator-val ${isDown ? 'down' : 'up'}">
                  ${item.value} (${sign}${String(item.change_str).replace('+', '')})
                </span>
              </div>
            `;
          }).join('');
        }

        // [C] 10대 뉴스 렌더링 (차트와 무관하게 1순위 출력)
        if (data.news && data.news.length > 0) {
          document.getElementById('news-list').innerHTML = data.news.map((n, idx) => `
            <div class="news-item">
              <div class="news-title">${idx + 1}. ${n.title}</div>
              <div class="news-link-box">
                <a href="${n.link}" target="_blank" rel="noopener noreferrer" class="news-link">🔗 [원문 링크]</a>
              </div>
              <div class="news-summary">${n.summary}</div>
            </div>
          `).join('');
        }

        // [D] 일정 렌더링
        if (data.schedules) {
          document.getElementById('calendar-info').innerHTML = data.schedules.map(item => `
            <div class="schedule-item">
              <strong>• ${item.title}:</strong> ${item.desc}
            </div>
          `).join('');
        }

        // [E] 차트 라이브러리 준비 완료 후 차트 생성
        loadTradingViewLibrary().then(() => {
          initCandleChart();
          initLineChart();
        }).catch(err => {
          document.getElementById('candle-chart').innerText = '차트 모듈을 불러오지 못했습니다.';
          document.getElementById('line-chart').innerText = '차트 모듈을 불러오지 못했습니다.';
        });

      })
      .catch(err => {
        document.getElementById('updated-time').innerText = "데이터 로딩 오류: " + err.message;
      });

    // 캔들차트 초기화
    function initCandleChart() {
      const container = document.getElementById('candle-chart');
      container.innerHTML = '';
      candleChart = LightweightCharts.createChart(container, {
        layout: { background: { color: '#1e1e1e' }, textColor: '#d1d4dc' },
        grid: { vertLines: { color: '#2b2b43' }, horzLines: { color: '#2b2b43' } },
        rightPriceScale: { borderColor: '#485c7b' },
        timeScale: { borderColor: '#485c7b' },
        autoSize: true,
      });

      candleSeries = candleChart.addCandlestickSeries({
        upColor: '#E57373',
        downColor: '#64B5F6',
        borderVisible: false,
        wickUpColor: '#E57373',
        wickDownColor: '#64B5F6',
      });

      selectIndexChart('S&P 500');
    }

    function selectIndexChart(indexName) {
      currentIndex = indexName;
      document.querySelectorAll('#index-tabs .tab-btn').forEach(b => {
        b.classList.toggle('active', b.innerText === indexName);
      });
      document.getElementById('current-index-title').innerText = `${indexName} 캔들차트`;

      if (!globalData || !globalData.indices || !globalData.indices.candles_dict) return;
      const candles = globalData.indices.candles_dict[indexName] || [];
      candleSeries.setData(candles);
      changeRange(currentRange);
    }

    function changeRange(range) {
      currentRange = range;
      document.querySelectorAll('.time-btn').forEach(btn => {
        btn.classList.toggle('active', btn.innerText === range);
      });
      if (!candleChart || !globalData || !globalData.indices || !globalData.indices.candles_dict) return;
      const candles = globalData.indices.candles_dict[currentIndex] || [];
      const totalBars = candles.length;
      let bars = 65;
      if (range === '6M') bars = 130;
      if (range === '1Y') bars = 250;
      if (range === '3Y') bars = 750;

      candleChart.timeScale().setVisibleLogicalRange({
        from: Math.max(0, totalBars - bars),
        to: totalBars
      });
    }

    // 거시지표 라인차트 초기화
    function initLineChart() {
      const container = document.getElementById('line-chart');
      container.innerHTML = '';
      lineChart = LightweightCharts.createChart(container, {
        layout: { background: { color: '#1e1e1e' }, textColor: '#d1d4dc' },
        grid: { vertLines: { color: '#2b2b43' }, horzLines: { color: '#2b2b43' } },
        rightPriceScale: { borderColor: '#485c7b' },
        timeScale: { borderColor: '#485c7b' },
        autoSize: true,
      });

      lineSeries = lineChart.addAreaSeries({
        topColor: 'rgba(100, 181, 246, 0.4)',
        bottomColor: 'rgba(100, 181, 246, 0.0)',
        lineColor: '#64B5F6',
        lineWidth: 2,
      });

      selectMacroChart('원/달러 환율');
    }

    function selectMacroChart(macroName) {
      currentMacro = macroName;
      document.querySelectorAll('#macro-tabs .tab-btn').forEach(b => {
        b.classList.toggle('active', b.innerText.includes(macroName.split(' ')[0]));
      });
      document.getElementById('current-macro-title').innerText = `${macroName} 추이 (3개월)`;

      if (!globalData || !globalData.macro || !globalData.macro.series_dict) return;
      const series = globalData.macro.series_dict[macroName] || [];
      lineSeries.setData(series);
      lineChart.timeScale().fitContent();
    }
  </script>
</body>
</html>
